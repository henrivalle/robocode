services:
  robocode-web:
    build:
      context: .
    container_name: robocode-web
    restart: unless-stopped
    ports:
      - "${ROBOCODE_WEB_PORT:-6080}:6080"
    environment:
      - GEOMETRY=${ROBOCODE_GEOMETRY:-1600x900x24}
      - NOVNC_PORT=6080
      - VNC_PORT=5901
      - VNC_PASSWORD=${ROBOCODE_VNC_PASSWORD:-}
    volumes:
      - robocode-data:/opt/robocode

volumes:
  robocode-data:
