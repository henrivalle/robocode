services:
  robocode-web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ROBOCODE_WEB_PORT:-6080}:6080"
    environment:
      - GEOMETRY=${ROBOCODE_GEOMETRY:-1600x900x24}
      - VNC_PASSWORD=${ROBOCODE_VNC_PASSWORD:-}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=2).close()
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 15
    volumes:
      - robocode-data:/opt/robocode

volumes:
  robocode-data:
