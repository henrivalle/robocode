name: Robocode Classroom CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check scripts and Compose configuration
        run: |
          shellcheck deploy-linux.sh scripts/entrypoint.sh tests/*.sh
          bash tests/compose-config.sh
      - name: Check clean installations and volume upgrades
        run: bash tests/smoke.sh
      - name: Package verified release source
        if: github.ref_type == 'tag'
        run: |
          git archive --prefix=robocode-classroom/ --format=tar.gz --output=robocode-classroom.tar.gz HEAD
          sha256sum robocode-classroom.tar.gz > SHA256SUMS
      - name: Upload release artifacts for review
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: robocode-classroom-source
          path: |
            robocode-classroom.tar.gz
            SHA256SUMS
          if-no-files-found: error
